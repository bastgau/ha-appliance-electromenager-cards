<script>
const R=[]; const ok=(name,cond,info='')=>R.push({name,pass:!!cond,info:cond?'':String(info)});

function hassOf(states,lang='fr'){const S={};states.forEach(s=>S[s.entity_id]=s);return{states:S,language:lang,locale:{language:lang},config:{},calls:[],callService(d,s,data){this.calls.push([d,s,data]);}};}
function card(kind,cfg,states,lang){const el=document.createElement(`appliance-${kind}-card`);el.setConfig(cfg);document.getElementById('g').appendChild(el);const h=hassOf(states,lang);el.hass=h;return {el,h,sr:el.shadowRoot,wrap:el.shadowRoot.getElementById('wrap'),txt:()=>el.shadowRoot.getElementById('info').textContent.replace(/\s+/g,' ').trim(),lcd:()=>el.shadowRoot.querySelector('.lcd')?.textContent};}

// enregistrement : nos 5 cartes, et les cartes d'origine laissées intactes
['tv-forked','av-receiver-forked','hue-sync-forked','tv-box-forked','mini-pc-forked'].forEach(t=>ok(`registered ${t}`,customElements.get(`appliance-${t}-card`)));
['tv-forked','av-receiver-forked','hue-sync-forked','tv-box-forked','mini-pc-forked'].forEach(t=>ok(`in the card picker: ${t}`,window.customCards.some(c=>c.type===`appliance-${t}-card`&&/^Appliance – /.test(c.name))));

{const ours=window.customCards.filter(c=>c.forked===true).map(c=>c.type).sort(), want=['appliance-av-receiver-forked-card','appliance-hue-sync-forked-card','appliance-mini-pc-forked-card','appliance-tv-box-forked-card','appliance-tv-forked-card'];

 ok('naming: the fork registers exactly our 5 cards',JSON.stringify(ours)===JSON.stringify(want),ours.join(', '));
 // un type sans suffixe peut exister côté amont (ex. appliance-mini-pc-card, carte photo ajoutée par le projet d'origine en 1.80) : il ne doit jamais être le nôtre
 {const ourCls=['tv','av-receiver','hue-sync','tv-box','mini-pc'].map(t=>customElements.get(`appliance-${t}-forked-card`));
  ['appliance-hue-sync-card','appliance-mini-pc-card'].forEach(t=>{const cl=customElements.get(t);
   ok(`naming: ${t} (no suffix) is never one of our classes`,!cl||!ourCls.includes(cl),t);
   ok(`naming: customCards entry of ${t} (if any) is not flagged forked`,window.customCards.filter(c=>c.type===t).every(c=>c.forked!==true),t);});}
 ok('naming: editor element of the Mini-PC follows the suffix and is distinct from any upstream editor',!!customElements.get('appliance-mini-pc-forked-card-editor')&&customElements.get('appliance-mini-pc-forked-card-editor')!==customElements.get('appliance-mini-pc-card-editor'),'');
 ok('picker names of the fork have no " / " (reserved for upstream "EN / FR" names) and each has an English name',window.customCards.filter(c=>c.forked===true).every(c=>!/ \/ /.test(c.name)&&c.names&&c.names.en&&Object.values(c.names).every(n=>!/ \/ /.test(n))),JSON.stringify(window.customCards.filter(c=>c.forked===true).map(c=>c.names)));
 ok('naming: no card without forked:true uses a -forked-card type',window.customCards.filter(c=>/-forked-card$/.test(c.type)&&c.forked!==true).length===0,'');}
// sentinelles : méthodes internes de l'amont dont dépendent nos sous-classes (si l'une disparaît, nos cartes sont désactivées)
{const Base=Object.getPrototypeOf(customElements.get('appliance-tv-card'));

 ['appliance-tv-card','appliance-av-receiver-card','appliance-generic-card'].forEach(t=>ok(`parent card exists: ${t}`,!!customElements.get(t)));
 ok('forked cards keep the parent kind (tv / av_receiver)',customElements.get('appliance-tv-forked-card').kind==='tv'&&customElements.get('appliance-av-receiver-forked-card').kind==='av_receiver');}
// les cartes d'origine ne gèrent PAS nos options
{const U={unit_of_measurement:'W',device_class:'power'};
 let c=card('tv',{switch:'switch.p',power:'sensor.w',ambilight:'switch.amb',sleep:'button.sl'},[mk('switch.p','on'),mk('sensor.w',120,U),mk('switch.amb','on'),mk('button.sl','unknown')]);

 c=card('av-receiver',{entity:'media_player.a',switch:'switch.p',sleep:'button.sl'},[mk('media_player.a','playing'),mk('switch.p','on'),mk('button.sl','unknown')]);
 ok('original av-receiver card: no sleep button',!c.sr.querySelector('button.slp'),c.sr.getElementById('actions').innerHTML.slice(0,80));}
// éditeur : nos champs s'ajoutent à ceux de l'amont, avec nos libellés traduits
{const f=customElements.get('appliance-tv-forked-card').getConfigForm(), names=f.schema.map(s=>s.name);

 c=card('tv-forked',{power:'sensor.p',ambilight_level:'number.lvl'},[mk('sensor.p',120,W),mk('number.lvl',100,{min:0,max:200})]); ok('tv level only (no switch) -> halo but no toggle tile',has(c,'amb-on')&&!amb(c),c.wrap.className);
